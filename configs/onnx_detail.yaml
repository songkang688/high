# 保护细节变体（onnx_detail）：保留更多皮肤纹理与毛孔，去油光力度弱于 default.yaml。
# 由 default.yaml 派生：检测掩码更克制（更高阈值/分位数、更少生长与膨胀），
# 修复走「保真」模式（无极端核心 inpaint），亮度压制/最终混合明显更弱。
# 用于导出 models/high_removal_detail.onnx（tools/export_high_removal_onnx.py --config 本文件）。

runtime:
  device: CPU
  mode: CPU狂暴模式
  threads: 0
  gpu_enabled: false

pipeline:
  process_scale: compromise
  enable_roi_removal: true
  roi_padding_ratio: 0.12
  refine_upsampled_masks: false
  enable_visualization: true

models:
  mediapipe_face_landmarker_task: "models/face_landmarker.task"
  yunet_model: "models/face_detection_yunet_2023mar.onnx"
  opencv_dnn_prototxt: "models/deploy.prototxt"
  opencv_dnn_caffemodel: "models/res10_300x300_ssd_iter_140000.caffemodel"

face_detection:
  face_detection_confidence: 0.50
  landmark_detection_confidence: 0.50
  enable_mediapipe: true
  enable_fallback_detector: true
  max_faces: 4
  low_confidence_warning_threshold: 0.65
  multi_face_strategy: "最大人脸"
  manual_face_index: 0
  enable_alignment: false
  show_landmark_index: false
  mediapipe_task_model_path: "models/face_landmarker.task"
  lbf_model_path: "models/lbfmodel.yaml"
  haar_scale_factor: 1.08
  haar_min_neighbors: 5
  allow_weak_fallback_for_debug: false

regions:
  nose_bridge_expand_ratio: 0.145
  nose_tip_expand_ratio: 0.96
  forehead_height_ratio: 1.54
  cheek_expand_ratio: 1.10
  chin_expand_ratio: 1.04
  # 保护细节：保护圈略微外扩（default 为 5），五官边缘留更多原图。
  protect_expand_radius: 6
  eye_protect_extra_radius: 1.0
  simple_protect_mode: true
  key_region_detection_mode: false
  protect_brows: true
  brow_protect_shrink_radius: 0
  brow_protect_height_ratio: 2.30
  brow_protect_width_ratio: 1.60
  brow_vertical_shift_ratio: 0.00
  brow_ridge_height_ratio: 0.82
  lip_protect_shrink_radius: 2
  philtrum_unprotect: true
  philtrum_width_ratio: 0.16
  skin_mask_smooth_radius: 4
  face_contour_shrink_ratio: 0.018

highlight_detection:
  # 基础绝对阈值。实际检测以区域自适应为主，绝对阈值只作为强证据之一。
  rgb_brightness_threshold: 192
  hsv_v_threshold: 178
  hsv_s_upper: 158
  # 保护细节：绝对 L 阈值大幅上调（default 178），只认更亮的高光。
  lab_l_threshold: 198
  local_brightness_threshold: 3
  local_contrast_threshold: 0.018
  saturation_pixel_threshold: 240
  # 保护细节：更大最小连通域 + 更小面积上限，滤掉细碎纹理点。
  highlight_min_area: 12
  highlight_max_area_ratio: 0.090
  # 保护细节：不膨胀、反而腐蚀 1px，掩码收得更紧。
  mask_dilate_radius: 0
  mask_erode_radius: 1
  mask_blur_radius: 8

  # 暖色油光增强：用于额头、鼻梁、鼻尖、脸颊、下巴这类非纯白反光。
  oil_shine_s_upper: 188
  adaptive_region_delta: 3.4
  adaptive_core_delta: 5.8
  # 保护细节：核心/光晕分位数上调（default 90/78），自适应检测更不贪婪。
  adaptive_halo_percentile: 85
  adaptive_core_percentile: 93
  # 保护细节：生长迭代减半（default 16），高光区域不向外扩散太远。
  adaptive_grow_iterations: 8
  relative_saturation_drop: -8.0
  # 保护细节：闭运算半径减小（default 4），少吞掉纹理缝隙。
  morph_close_radius: 2
  # 保护细节：软掩码增益下调（default 1.85），过渡带处理力度更轻。
  soft_mask_gain: 1.40
  local_sigma: 6.0
  large_local_sigma: 28.0
  local_skin_chroma_delta_upper: 42
  fallback_seed_percentile: 93
  max_component_expand_ratio: 1.35

  forehead_region_max_fraction: 0.35
  nose_bridge_region_max_fraction: 0.72
  nose_tip_region_max_fraction: 0.62
  cheek_region_max_fraction: 0.26
  skin_region_max_fraction: 0.35
  chin_region_max_fraction: 0.24
  philtrum_region_max_fraction: 0.32
  brow_region_max_fraction: 0.28

highlight_removal:
  # 保护细节：改走「保真」亮度压制（default 为「混合」，会对极端核心二次 inpaint）。
  mode: 保真
  brightness_suppress_strength: 0.62
  chroma_restore_strength: 0.22
  texture_preserve_strength: 0.92
  edge_protect_strength: 0.62
  inpainting_radius: 2
  poisson_alpha_strength: 0.50
  final_blend_alpha: 0.78
  max_allowed_modify_area_ratio: 0.12
  max_allowed_mean_brightness_change: 12
  max_allowed_local_color_delta: 9
  faithful_luminance_floor: 0.88
  extreme_core_extra_l: 4
