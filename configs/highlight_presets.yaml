# 高光检测 / 去高光三套预设。标准套以 default.yaml 为准，此处只定义高敏与低敏差异项。
presets:
  高敏:
    highlight_detection:
      rgb_brightness_threshold: 192
      hsv_v_threshold: 178
      hsv_s_upper: 158
      lab_l_threshold: 178
      local_brightness_threshold: 3
      local_contrast_threshold: 0.018
      saturation_pixel_threshold: 240
      highlight_min_area: 5
      highlight_max_area_ratio: 0.155
      mask_dilate_radius: 2
      mask_erode_radius: 0
      mask_blur_radius: 8
      oil_shine_s_upper: 188
      adaptive_region_delta: 3.4
      adaptive_core_delta: 5.8
      adaptive_grow_iterations: 16
      morph_close_radius: 4
      soft_mask_gain: 1.85
      forehead_region_max_fraction: 0.35
      nose_tip_region_max_fraction: 0.62
      cheek_region_max_fraction: 0.26
    highlight_removal:
      mode: 混合
      brightness_suppress_strength: 0.92
      chroma_restore_strength: 0.36
      texture_preserve_strength: 0.72
      edge_protect_strength: 0.40
      inpainting_radius: 6
      poisson_alpha_strength: 0.78
      final_blend_alpha: 0.96
      max_allowed_modify_area_ratio: 0.18
      max_allowed_mean_brightness_change: 20
      max_allowed_local_color_delta: 14

  低敏:
    highlight_detection:
      rgb_brightness_threshold: 218
      hsv_v_threshold: 202
      hsv_s_upper: 142
      lab_l_threshold: 198
      local_brightness_threshold: 8
      local_contrast_threshold: 0.034
      saturation_pixel_threshold: 248
      highlight_min_area: 14
      highlight_max_area_ratio: 0.090
      mask_dilate_radius: 0
      mask_erode_radius: 1
      mask_blur_radius: 10
      oil_shine_s_upper: 162
      adaptive_region_delta: 6.8
      adaptive_core_delta: 10.8
      adaptive_grow_iterations: 7
      morph_close_radius: 2
      soft_mask_gain: 1.42
      forehead_region_max_fraction: 0.22
      nose_tip_region_max_fraction: 0.48
      cheek_region_max_fraction: 0.14
    highlight_removal:
      mode: 保真
      brightness_suppress_strength: 0.72
      chroma_restore_strength: 0.22
      texture_preserve_strength: 0.86
      edge_protect_strength: 0.52
      inpainting_radius: 4
      poisson_alpha_strength: 0.52
      final_blend_alpha: 0.86
      max_allowed_modify_area_ratio: 0.11
      max_allowed_mean_brightness_change: 12
      max_allowed_local_color_delta: 9
